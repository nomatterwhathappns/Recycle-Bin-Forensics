name: Windows portable package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-package:
    name: Build and verify Windows x64 desktop package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          architecture: x64
      - name: Install build and test dependencies
        run: python -m pip install ".[dev,freeze]"
      - name: Exercise the native desktop application
        env:
          RBF_RUN_GUI: "1"
        run: python -m pytest tests/test_gui.py tests/test_gui_entry.py --cov=rbinforensics.gui --cov-config=tools/gui.coveragerc --cov-report=term-missing --cov-fail-under=85 -v
      - name: Build and smoke-test the bundled desktop application
        run: python tools/build_windows.py
      - name: Upload portable distribution and SHA-256 checksum
        uses: actions/upload-artifact@v4
        with:
          name: RecycleBinForensics-windows-x64
          path: |
            dist/windows/*.zip
            dist/windows/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

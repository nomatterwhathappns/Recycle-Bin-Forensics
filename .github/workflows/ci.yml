name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gui:
    name: Native desktop application validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test dependencies
        run: python -m pip install ".[dev]"
      - name: Exercise desktop workflows in a virtual display
        env:
          RBF_RUN_GUI: "1"
        run: xvfb-run -a python -m pytest tests/test_gui.py tests/test_gui_entry.py --cov=rbinforensics.gui --cov-config=tools/gui.coveragerc --cov-report=term-missing --cov-fail-under=85 -v
  browser:
    name: Offline HTML browser validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install browser test dependencies
        run: python -m pip install ".[dev,browser]"
      - name: Exercise interactive report in Chromium
        env:
          RBF_RUN_BROWSER: "1"
        run: python -m pytest tests/test_browser_html.py -v
  windows-live:
    name: Controlled Windows Shell validation
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install package and test dependencies
        run: python -m pip install ".[dev]"
      - name: Validate real Shell-generated Recycle Bin artifacts
        env:
          RBF_RUN_WINDOWS_LIVE: "1"
        run: python -m pytest tests/test_windows_live.py -v -o junit_family=xunit1 --junitxml=windows-live.xml
      - name: Preserve controlled validation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: controlled-windows-validation
          path: windows-live.xml
          retention-days: 14
  test:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.13"]
        include:
          - os: ubuntu-latest
            python: "3.14"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install package and development dependencies
        run: python -m pip install ".[dev]"
      - name: Run tests and measure branch coverage
        run: python -m pytest --cov=rbinforensics --cov-report=term-missing --cov-fail-under=85

  quality-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install ".[dev]"
      - name: Lint
        run: python -m ruff check .
      - name: Check formatting
        run: python -m ruff format --check .
      - name: Build source distribution and wheel
        run: python -m build
      - name: Smoke-test the installed wheel without runtime dependencies
        shell: bash
        run: |
          python -m venv .wheel-smoke
          .wheel-smoke/bin/python -m pip install --no-deps dist/*.whl
          .wheel-smoke/bin/rbf --help
          .wheel-smoke/bin/python -m rbinforensics --help

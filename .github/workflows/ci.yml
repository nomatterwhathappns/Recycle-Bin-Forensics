name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  gui:
    name: Native desktop application validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test dependencies
        run: python -m pip install ".[dev]"
      - name: Exercise desktop workflows in a virtual display
        env:
          RBF_RUN_GUI: "1"
        run: xvfb-run -a python -m pytest tests/test_gui.py tests/test_gui_entry.py tests/test_detail_view.py --cov=rbinforensics.gui --cov=rbinforensics.detail_view --cov-config=tools/gui.coveragerc --cov-report=term-missing --cov-fail-under=85 -v
  browser:
    name: Offline HTML browser validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install browser test dependencies
        run: python -m pip install ".[dev,browser]"
      - name: Exercise interactive report in Chromium
        env:
          RBF_RUN_BROWSER: "1"
        run: python -m pytest tests/test_browser_html.py -v
  windows-live:
    name: Controlled Windows Shell validation
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install package and test dependencies
        run: python -m pip install ".[dev]"
      - name: Validate real Shell-generated Recycle Bin artifacts
        env:
          RBF_RUN_WINDOWS_LIVE: "1"
          RBF_WINDOWS_SAMPLE_DIR: work/windows-reference-samples
        run: python -m pytest tests/test_windows_live.py -v -o junit_family=xunit1 --junitxml=windows-live.xml
      - name: Preserve controlled validation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: controlled-windows-validation
          path: windows-live.xml
          retention-days: 14
      - name: Preserve only verified controlled Shell samples
        uses: actions/upload-artifact@v4
        with:
          name: windows-reference-samples
          path: work/windows-reference-samples
          if-no-files-found: error
          retention-days: 14
  reference:
    name: Independent parser and corpus validation
    needs: windows-live
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install ".[dev]"
      - name: Download controlled Shell samples
        uses: actions/download-artifact@v4
        with:
          name: windows-reference-samples
          path: work/windows-reference-samples
      - name: Install pinned independent parser
        run: |
          mkdir -p work/reference-results
          curl --fail --location --retry 3 --output work/rifiuti2.deb \
            https://deb.debian.org/debian/pool/main/r/rifiuti2/rifiuti2_0.8.2-1_amd64.deb
          python - <<'PY'
          import hashlib
          from pathlib import Path
          expected = "00c273928431c14ab315886964690c26fc68762f40443ea69a9de334037ae83f"
          if hashlib.sha256(Path("work/rifiuti2.deb").read_bytes()).hexdigest() != expected:
              raise SystemExit("Reference package checksum mismatch")
          PY
          dpkg-deb -x work/rifiuti2.deb work/reference
      - name: Verify synthetic corpus and compare reference fields
        run: |
          python examples/generate_corpus.py work/reference-corpus
          python examples/verify_corpus.py work/reference-corpus
          python tools/compare_reference.py --corpus work/reference-corpus \
            --reference work/reference/usr/bin/rifiuti-vista --allow-known-differences \
            --output work/reference-results/synthetic-reference.json
      - name: Compare independently generated Windows Shell samples
        run: |
          python tools/compare_reference.py --windows-samples work/windows-reference-samples \
            --reference work/reference/usr/bin/rifiuti-vista \
            --output work/reference-results/windows-reference.json
      - name: Preserve reference results including documented differences
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reference-validation-results
          path: work/reference-results/*.json
          if-no-files-found: error
          retention-days: 30
  test:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.13"]
        include:
          - os: ubuntu-latest
            python: "3.14"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install package and development dependencies
        run: python -m pip install ".[dev]"
      - name: Run tests and measure branch coverage
        run: python -m pytest --cov=rbinforensics --cov-report=term-missing --cov-fail-under=85

  quality-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install ".[dev]"
      - name: Lint
        run: python -m ruff check .
      - name: Check formatting
        run: python -m ruff format --check .
      - name: Build source distribution and wheel
        run: python -m build
      - name: Smoke-test the installed wheel without runtime dependencies
        shell: bash
        run: |
          python -m venv .wheel-smoke
          .wheel-smoke/bin/python -m pip install --no-deps dist/*.whl
          .wheel-smoke/bin/rbf --help
          .wheel-smoke/bin/python -m rbinforensics --help

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rbinforensics"
version = "1.2.0"
description = "Offline Recycle Bin forensics with artifact inventory, filters, timelines and HTML reports"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "nomatterwhathappns" }]
keywords = ["forensics", "dfir", "windows", "recycle-bin", "metadata"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Information Technology",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.9,<1",
  "build>=1.2,<2",
  "jsonschema[format-nongpl]>=4.23,<5",
  "tzdata>=2025.2",
]
timezone = ["tzdata>=2025.2"]
browser = ["playwright>=1.50,<2"]
freeze = ["pyinstaller>=6.10,<7", "tzdata>=2025.2"]

[project.scripts]
rbf = "rbinforensics.cli:main"

[project.gui-scripts]
rbf-gui = "rbinforensics.gui:main"

[project.urls]
Homepage = "https://github.com/nomatterwhathappns/Recycle-Bin-Forensics"
Repository = "https://github.com/nomatterwhathappns/Recycle-Bin-Forensics"
Issues = "https://github.com/nomatterwhathappns/Recycle-Bin-Forensics/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["rbinforensics"]
branch = true
# Native Tk coverage is measured independently under a real display, using
# tools/gui.coveragerc in the desktop CI job; CLI-only hosts need no display.
omit = ["*/rbinforensics/gui.py", "*/rbinforensics/detail_view.py"]

[tool.coverage.report]
show_missing = true
precision = 2

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
